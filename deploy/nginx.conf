# Replace care.example.com and certificate paths with your actual domain.
server {
    listen 80;
    server_name care.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name care.example.com;
    ssl_certificate /etc/letsencrypt/live/care.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/care.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 51m;

    # Never expose /var/lib/jinlin or add a static alias for uploaded media.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering on;
        proxy_buffering off;
    }
}
